name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 검사
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check.mjs --base "origin/${{ github.base_ref }}"
          else
            node scripts/check.mjs
          fi
